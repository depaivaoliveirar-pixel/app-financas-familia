<script type="module">
import * as pdfjsLib from './codigo/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './codigo/pdf.worker.min.mjs';

async function pdfLines(bytes, senha) {
  const doc = await pdfjsLib.getDocument({ data: bytes, password: senha, isEvalSupported: false }).promise;
  const out = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim() !== '').map(i => ({ s: i.str, x: i.transform[4], y: Math.round(i.transform[5] * 2) / 2, w: i.width }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const linhas = [];
    for (const it of items) {
      const l = linhas.find(l => Math.abs(l.y - it.y) <= 2.5);
      if (l) l.its.push(it); else linhas.push({ y: it.y, its: [it] });
    }
    linhas.sort((a, b) => b.y - a.y);
    for (const l of linhas) {
      l.its.sort((a, b) => a.x - b.x);
      let txt = '', fim = null;
      for (const it of l.its) {
        if (fim === null) txt = it.s;
        else txt += (it.x - fim > 8 ? '\t' : (it.x - fim > 0.5 ? ' ' : '')) + it.s;
        fim = it.x + it.w;
      }
      out.push({ page: p, y: l.y, text: txt.replace(/[  ]+/g, ' ').trim() });
    }
  }
  return out;
}

const L = window.Leitores, M = window.Motor;

/* ---------------- armazenamento (File System Access API) ---------------- */
const DB_NOME = 'financas-familia', DB_VERSAO = 1, DB_LOJA = 'config';
function abrirDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NOME, DB_VERSAO);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_LOJA);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function guardarValor(chave, valor) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_LOJA, 'readwrite');
    tx.objectStore(DB_LOJA).put(valor, chave);
    tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
  });
}
async function lerValor(chave) {
  const db = await abrirDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_LOJA, 'readonly');
    const req = tx.objectStore(DB_LOJA).get(chave);
    req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
  });
}

const ARQUIVO_DADOS = 'financas-familia-dados.json';
let pastaHandle = null;

async function escolherPasta() {
  pastaHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  await guardarValor('pastaHandle', pastaHandle);
  return pastaHandle;
}
async function recuperarPasta() {
  const h = await lerValor('pastaHandle');
  if (!h) return null;
  try {
    const perm = await h.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') { pastaHandle = h; return h; }
    return null; // precisa pedir permissão de novo com gesto do usuário
  } catch (e) { return null; }
}
async function pedirPermissaoPasta(h) {
  const perm = await h.requestPermission({ mode: 'readwrite' });
  if (perm === 'granted') { pastaHandle = h; return true; }
  return false;
}
async function salvarEstado() {
  if (!pastaHandle || !estado) return;
  const fh = await pastaHandle.getFileHandle(ARQUIVO_DADOS, { create: true });
  const ws = await fh.createWritable();
  await ws.write(M.serializar(estado));
  await ws.close();
}
async function carregarEstadoDaPasta() {
  try {
    const fh = await pastaHandle.getFileHandle(ARQUIVO_DADOS);
    const file = await fh.getFile();
    const texto = await file.text();
    return M.desserializar(texto);
  } catch (e) { return null; }
}

// Pasta compartilhada do Google Drive da família (opcional, separada da pasta de dados principal) — pra
// salvar o arquivo da Casa direto nela, sem download manual. Mesmo mecanismo da pasta de dados (IndexedDB).
let pastaCasaHandle = null;
async function escolherPastaCasa() {
  pastaCasaHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  await guardarValor('pastaCasaHandle', pastaCasaHandle);
  return pastaCasaHandle;
}
async function recuperarPastaCasa() {
  const h = await lerValor('pastaCasaHandle');
  if (!h) return null;
  try {
    const perm = await h.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') { pastaCasaHandle = h; return h; }
    return null;
  } catch (e) { return null; }
}
async function pedirPermissaoPastaCasa(h) {
  const perm = await h.requestPermission({ mode: 'readwrite' });
  if (perm === 'granted') { pastaCasaHandle = h; return true; }
  return false;
}
async function esquecerPastaCasa() {
  pastaCasaHandle = null;
  await guardarValor('pastaCasaHandle', null);
}
async function salvarArquivoNaPastaCasa(texto, nome) {
  const fh = await pastaCasaHandle.getFileHandle(nome, { create: true });
  const ws = await fh.createWritable();
  await ws.write('﻿' + texto);
  await ws.close();
}

/* ---------------- estado global do app ---------------- */
let estado = null;
let mesAtual = null;
let filtroLancamentos = 'Todos';
let dadosClassificando = {}; // chave -> {tipo, categoria, frequencia} enquanto a pessoa preenche a tela Classificar

function mesFmt(competencia) {
  if (!competencia) return '';
  const MESES = 'janeiro fevereiro março abril maio junho julho agosto setembro outubro novembro dezembro'.split(' ');
  const [a, m] = competencia.split('-').map(Number);
  return MESES[m - 1] + ' de ' + a;
}
function dataFmt(iso) { const [, m, d] = iso.split('-'); return d + '/' + m; }
function moeda(v) { return 'R$ ' + (v < 0 ? '-' : '') + Math.abs(v).toFixed(2).replace('.', ',').replace(/\d(?=(\d{3})+,)/g, '$&.'); }

function toast(msg, ehErro) {
  const el = document.createElement('div');
  el.className = 'toast' + (ehErro ? ' erro' : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* ---------------- ciclo de vida ---------------- */
async function iniciar() {
  await recuperarPastaCasa();
  const h = await recuperarPasta();
  if (h) {
    const e = await carregarEstadoDaPasta();
    if (e) { estado = e; }
  }
  if (!estado) viewAtual = 'capa';
  renderizar();
}

function estadoPronto() { return !!estado; }

/* ---------------- views ---------------- */
const VIEWS = {};
let viewAtual = 'inicio';

function irPara(v) { viewAtual = v; renderizar(); }

function layout(conteudoHtml) {
  const perfilLabel = estado ? (estado.nomePessoa || 'Minha conta') : '';
  const qtdNovidades = estado ? M.novidades(estado).length : 0;
  const abas = [
    ['inicio', 'Início'], ['classificar', 'Classificar'], ['resumo', 'Resumo'],
    ['lancarManual', 'Lançar manualmente'], ['ajustes', 'Ajustes'], ['sobre', 'Sobre'], ['ajuda', 'Ajuda']
  ];
  const nav = abas.map(([k, label]) => {
    const badge = k === 'classificar' && qtdNovidades > 0 ? `<span class="conta">${qtdNovidades}</span>` : '';
    return `<button data-ir="${k}" class="${viewAtual === k ? 'ativo' : ''}">${label}${badge}</button>`;
  }).join('');
  document.getElementById('app').innerHTML = `
    <header class="topo">
      <div class="marca">
        <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/></svg></div>
        <div><div class="nome">Finanças da Família</div><div class="perfil">${perfilLabel ? 'Perfil: ' + perfilLabel : ''}</div></div>
      </div>
      <nav class="menu" aria-label="Menu principal">${nav}</nav>
    </header>
    <main class="conteudo">${conteudoHtml}</main>
  `;
  document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => irPara(b.dataset.ir));
}

function renderizar() {
  if (!estadoPronto() && !['configuracaoInicial', 'sobre', 'capa', 'resumoApp'].includes(viewAtual)) {
    renderConfiguracaoInicial();
    return;
  }
  (VIEWS[viewAtual] || VIEWS.inicio)();
}

/* ---------- Configuração inicial (1ª vez) ---------- */
function renderConfiguracaoInicial() {
  document.getElementById('app').innerHTML = `
    <main class="conteudo" style="max-width:640px">
      <div class="card">
        <h1>Bem-vindo(a) ao Finanças da Família</h1>
        <p class="sub">Antes de começar, escolha a pasta onde o app vai guardar seus dados (só neste computador, sem internet) e conte um pouco sobre você. Não sabe do que se trata? <a href="#" id="cfgSobre">Veja do que é este app</a>.</p>
        <div style="background:var(--cinza-bg);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--texto4);margin-bottom:16px;line-height:1.5">
          <strong>Onde salvar:</strong> escolha (ou crie) uma pasta só sua, por exemplo <code>Documentos\\Finanças</code>. Esse arquivo guarda seus gastos <strong>Pessoais</strong> também — evite escolher uma pasta do Google Drive compartilhada com outras pessoas, pra ninguém mais conseguir ver.
        </div>
        ${location.protocol === 'file:' ? `<div style="background:var(--vermelho-bg);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--vermelho-texto);margin-bottom:16px;line-height:1.5">
          <strong>Abra este arquivo de um jeito diferente:</strong> escolher a pasta não funciona abrindo o arquivo direto (clique duplo). Siga as instruções que vieram junto com o app para abrir certo.
        </div>` : ''}
        <div style="display:flex;flex-direction:column;gap:16px">
          <label class="campo">Seu nome
            <input type="text" id="cfgNome" placeholder="Ex.: Maria">
          </label>
          <label class="campo">Perfil de categorias
            <select id="cfgPerfil">
              <option value="padrao">Padrão (categorias curtas)</option>
              <option value="priscila">Completo (categorias de moradia, filhos, seguros, metas...)</option>
            </select>
          </label>
          <label class="campo">Seu nome completo, para identificar transferências entre suas próprias contas (opcional)
            <input type="text" id="cfgTitular" placeholder="Ex.: Maria da Silva Santos">
          </label>
          <button class="btn btn-primario btn-grande" id="cfgContinuar">Escolher pasta e começar</button>
          <p style="margin:0;font-size:13px;color:var(--texto3)">Precisa ser no Chrome ou Edge, no computador — não funciona no celular.</p>
          <button class="btn" id="cfgSemPasta" style="font-size:13px;min-height:36px;align-self:flex-start">Continuar sem escolher pasta (teste — não salva nada)</button>
        </div>
      </div>
    </main>
  `;
  document.getElementById('cfgSobre').onclick = (e) => { e.preventDefault(); irPara('sobre'); };
  document.getElementById('cfgContinuar').onclick = async () => {
    const nome = document.getElementById('cfgNome').value.trim();
    const perfil = document.getElementById('cfgPerfil').value;
    const titular = document.getElementById('cfgTitular').value.trim();
    if (!nome) { toast('Informe seu nome.', true); return; }
    if (!window.showDirectoryPicker) { toast('Seu navegador não tem suporte a isso. Use Chrome ou Edge no computador.', true); return; }
    try {
      await escolherPasta();
      let e = await carregarEstadoDaPasta();
      if (!e) {
        e = M.estadoNovo(perfil, titular ? [titular] : []);
      }
      if (!e.nomePessoa) M.definirNomePessoa(e, nome);
      estado = e;
      await salvarEstado();
      viewAtual = 'inicio';
      renderizar();
      toast('Tudo pronto! Seus dados ficam na pasta que você escolheu.');
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      toast('Não consegui acessar a pasta: ' + err.message, true);
    }
  };
  document.getElementById('cfgSemPasta').onclick = () => {
    const nome = document.getElementById('cfgNome').value.trim() || 'Teste';
    const perfil = document.getElementById('cfgPerfil').value;
    const titular = document.getElementById('cfgTitular').value.trim();
    estado = M.estadoNovo(perfil, titular ? [titular] : []);
    M.definirNomePessoa(estado, nome);
    viewAtual = 'inicio';
    renderizar();
    toast('Modo de teste: nada será salvo ao recarregar a página.');
  };
}

/* ---------- Início ---------- */

  const novidades = M.novidades(estado);

          <span style="font-size:15px;color:var(--texto2)">Bancos aceitos:</span>
          <span class="pill">Banco do Brasil</span><span class="pill">XP</span><span class="pill">Sicoob</span>

        </div>
        <button type="button" class="btn" style="margin-top:24px" data-ir="guia">Onde baixo meu extrato?</button>
        <div id="statusImportacao" style="margin-top:20px"></div>
      </section>
      <aside style="display:flex;flex-direction:column;gap:20px;min-width:0">
        <div class="card">
          <h2>Últimas importações</h2>
          ${importacoes.length ? `<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:15px">
            ${importacoes.map(i => `<li style="display:flex;justify-content:space-between;gap:12px"><span>${i.conta}<br><span style="color:var(--texto3);font-size:13px">${i.arquivo}</span></span><span style="color:var(--verde-ok);font-weight:600">OK</span></li>`).join('')}
          </ul>` : `<p style="margin:0;font-size:15px;color:var(--texto2)">Nenhuma importação ainda.</p>`}
        </div>
        ${novidades.length ? `<div class="card" style="background:var(--amarelo-bg);border-color:var(--amarelo-borda)">
          <h2>${novidades.length} novidade${novidades.length > 1 ? 's' : ''} esperando você</h2>
          <p class="sub" style="margin-bottom:16px">São lugares que o app ainda não conhece. Depois de classificar, ele lembra sozinho.</p>
          <button type="button" class="btn btn-casa" style="width:100%" data-ir="classificar">Classificar agora</button>
        </div>` : ''}
        <p style="margin:0;font-size:13px;color:var(--texto3);line-height:1.5">Seus dados ficam só neste computador, na pasta que você escolheu.</p>
      </aside>
    </div>
  `);
  const zona = document.getElementById('zonaArrastar');
  const inputArq = document.getElementById('inputArquivos');
  inputArq.onchange = () => processarArquivos(inputArq.files);
  zona.addEventListener('dragover', e => { e.preventDefault(); zona.classList.add('sobre'); });
  zona.addEventListener('dragleave', () => zona.classList.remove('sobre'));
  zona.addEventListener('drop', e => {
    e.preventDefault(); zona.classList.remove('sobre');
    if (e.dataTransfer.files.length) processarArquivos(e.dataTransfer.files);
  });
};

async function processarArquivos(fileList) {
  const status = document.getElementById('statusImportacao');
  const arquivos = Array.from(fileList);
  for (const arquivo of arquivos) {
    status.innerHTML += `<p style="margin:4px 0;font-size:14px;color:var(--texto2)">Lendo ${arquivo.nome || arquivo.name}…</p>`;
    const bytes = new Uint8Array(await arquivo.arrayBuffer());
    let senha = null, tentativas = 0, resultado = null;
    while (tentativas < 3) {
      try {
        resultado = await L.lerArquivo(arquivo.name, bytes, { senha, nomesTitular: estado.nomesTitular, linhasPDF: (b, pw) => pdfLines(b.slice(), pw) });
        break;
      } catch (e) {
        if (e.precisaSenha) {
          senha = prompt('Este arquivo "' + arquivo.name + '" tem senha. Digite a senha (não guardamos):');
          if (senha == null) { status.innerHTML += mensagemStatus(arquivo.name, 'Importação cancelada (sem senha).', true); toast(arquivo.name + ': importação cancelada (sem senha).', true); break; }
          tentativas++;
          continue;
        }
        const msgErro = e.amigavel ? e.message : 'Erro inesperado ao ler o arquivo.';
        status.innerHTML += mensagemStatus(arquivo.name, msgErro, true);
        toast(arquivo.name + ': ' + msgErro, true);
        resultado = null;
        break;
      }
    }
    if (!resultado) continue;
    const r = M.importar(estado, resultado);
    let msg = `${resultado.banco} ${resultado.tipo} — ${r.novos} lançamento(s) novo(s)` + (r.duplicados ? `, ${r.duplicados} já existiam` : '') + '.';
    status.innerHTML += mensagemStatus(arquivo.name, msg, false);
    if (r.aviso) { status.innerHTML += mensagemStatus(arquivo.name, r.aviso, true, true); toast(arquivo.name + ': ' + r.aviso, true); }
  }
  await salvarEstado();
  irPara('inicio');
}
function mensagemStatus(arquivo, msg, ehErro, ehAviso) {
  const cor = ehErro ? (ehAviso ? 'var(--laranja-escuro)' : 'var(--vermelho-texto)') : 'var(--verde-oktexto)';
  return `<p style="margin:4px 0;font-size:14px;color:${cor}"><strong>${arquivo}:</strong> ${msg}</p>`;
}

/* ---------- Classificar (Novidades) ---------- */
VIEWS.classificar = function () {

  const pendentes = M.conciliacoesPendentesDetalhadas(estado);
  if (!grupos.length && !pendentes.length) {
    layout(`<div class="card"><h1>Tudo classificado!</h1><p class="sub">Não há nada novo para classificar agora.</p><button class="btn btn-primario" data-ir="inicio">Voltar ao início</button></div>`);

  }
  layout(`
    <div style="display:flex;flex-direction:column;gap:20px">
      ${pendentes.length ? `<div>
        <h1 style="font-size:24px">Confira: pode ser um destes lançamentos que você já cadastrou</h1>
        <p class="sub">Dois ou mais lançamentos manuais batem com o que chegou no extrato. Escolha qual é (ou diga que não é nenhum).</p>
        ${pendentes.map((p, i) => `
          <article class="card" style="margin-bottom:12px">
            <div style="font-weight:700">${p.importado.descricao} — ${moeda(-p.importado.valor)} em ${dataFmt(p.importado.data)}</div>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
              ${p.candidatos.map(c => `<label style="display:flex;align-items:center;gap:8px;font-size:15px"><input type="radio" name="pend${i}" value="${c.id}"> ${c.descricao} — ${moeda(-c.valor)} em ${dataFmt(c.data)}</label>`).join('')}
            </div>
            <div style="display:flex;gap:10px;margin-top:14px">
              <button class="btn btn-primario" data-confirmar-pendente="${p.importado.id}">Confirmar escolha</button>
              <button class="btn" data-rejeitar-pendente="${p.importado.id}">Não é nenhum destes</button>
            </div>
          </article>`).join('')}
      </div>` : ''}
      ${grupos.length ? `<div>
        <h1 style="font-size:30px">${grupos.length} lugar${grupos.length > 1 ? 'es' : ''} nov${grupos.length > 1 ? 'os' : 'o'}</h1>
        <p class="sub">Diga uma vez se é gasto (ou entrada de dinheiro) <strong>Pessoal</strong> ou da <strong>Casa</strong>. Nas próximas vezes o app faz isso sozinho.</p>
        ${grupos.map((g, i) => renderGrupoClassificar(g, i)).join('')}
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;padding-top:8px">
          <button class="btn" data-ir="inicio">Deixar para depois</button>
          <button class="btn btn-primario btn-grande" id="salvarClassificacoes">Salvar e lembrar</button>
        </div>
      </div>` : ''}
    </div>
  `);
  document.querySelectorAll('[data-confirmar-pendente]').forEach(b => b.onclick = async () => {
    const id = b.dataset.confirmarPendente;
    const sel = document.querySelector(`input[name="pend${pendentes.findIndex(p => p.importado.id === id)}"]:checked`);
    if (!sel) { toast('Escolha uma opção.', true); return; }
    M.confirmarConciliacao(estado, id, sel.value);
    await salvarEstado();
    irPara('classificar');
  });
  document.querySelectorAll('[data-rejeitar-pendente]').forEach(b => b.onclick = async () => {
    M.rejeitarConciliacao(estado, b.dataset.rejeitarPendente);
    await salvarEstado();
    irPara('classificar');
  });
  document.getElementById('salvarClassificacoes')?.addEventListener('click', async () => {
    let faltou = false;
    for (let i = 0; i < grupos.length; i++) {
      const g = grupos[i];
      const tipoBtn = document.querySelector(`[data-grupo="${i}"].tipo-ativo`);
      if (!tipoBtn) { faltou = true; continue; }
      const tipo = tipoBtn.dataset.tipo;
      try {
        if (g.ehReceita) {
          M.classificarReceita(estado, g.chave, tipo);
        } else {
          const categoria = document.getElementById('cat' + i).value;
          const freqEl = document.getElementById('freq' + i);
          const frequencia = freqEl ? freqEl.value : undefined;
          M.classificar(estado, g.chave, tipo, categoria, frequencia);
        }
      } catch (e) { toast(g.descricaoExemplo + ': ' + e.message, true); faltou = true; }
    }
    if (faltou) { toast('Alguns itens ficaram sem classificar. Classifique-os ou deixe para depois.', true); }
    await salvarEstado();
    irPara(faltou ? 'classificar' : 'inicio');
  });
  grupos.forEach((g, i) => {
    document.querySelectorAll(`[data-grupo="${i}"]`).forEach(b => b.onclick = () => {
      document.querySelectorAll(`[data-grupo="${i}"]`).forEach(x => x.classList.remove('tipo-ativo'));
      b.classList.add('tipo-ativo');
      atualizarEstiloTipo(i);
      const freqWrap = document.getElementById('freqWrap' + i);
      if (freqWrap) freqWrap.classList.toggle('oculto', b.dataset.tipo !== 'Casa');
    });
  });
};
function renderGrupoClassificar(g, i) {
  const corCasa = g.ehReceita ? '#15803D' : '#B45309'; // receita Casa = "pote comum" (verde), despesa Casa = laranja
  return `
    <article class="card" style="display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-bottom:12px${g.ehReceita ? ';border-left:4px solid #15803D' : ''}">
      <div style="flex:1 1 260px;min-width:0">
        ${g.ehReceita ? '<span class="pill" style="background:var(--verde-okbg);color:var(--verde-oktexto);margin-bottom:6px;display:inline-block">Entrada de dinheiro</span><br>' : ''}
        <div style="font-size:19px;font-weight:700">${g.chave}</div>
        <div style="font-size:14px;color:var(--texto3);margin-top:4px">${g.quantidade} lançamento${g.quantidade > 1 ? 's' : ''} · ${moeda(g.total)} · ${g.origens.join(', ')}</div>
      </div>
      <div role="group" aria-label="Pessoal ou Casa" style="display:flex;gap:8px">
        <button type="button" data-grupo="${i}" data-tipo="Pessoal" style="min-height:48px;padding:0 22px;border-radius:12px;border:2px solid #1D4ED8;background:#fff;color:#1D4ED8;font-weight:600">Pessoal</button>
        <button type="button" data-grupo="${i}" data-tipo="Casa" style="min-height:48px;padding:0 22px;border-radius:12px;border:2px solid ${corCasa};background:#fff;color:${corCasa};font-weight:600">${g.ehReceita ? 'Casa (pote comum)' : 'Casa'}</button>
      </div>
      ${g.ehReceita ? '' : `
      <label class="campo">Categoria
        <select id="cat${i}" style="min-width:200px">${estado.categorias.map(c => `<option>${c}</option>`).join('')}</select>
      </label>
      <label class="campo oculto" id="freqWrap${i}">Frequência
        <select id="freq${i}">${M.FREQUENCIAS.map(f => `<option>${f}</option>`).join('')}</select>
      </label>`}
    </article>
  `;
}
function atualizarEstiloTipo(i) {
  document.querySelectorAll(`[data-grupo="${i}"]`).forEach(b => {
    const ativo = b.classList.contains('tipo-ativo');
    const cor = b.style.borderColor; // já vem certo do render (laranja = despesa Casa, verde = receita Casa, azul = Pessoal)
    b.style.background = ativo ? cor : '#fff';
    b.style.color = ativo ? '#fff' : cor;
  });
}

          </table>
        </div>

  `);
  document.getElementById('mesAnterior').onclick = () => { if (idx < meses.length - 1) { mesAtual = meses[idx + 1]; irPara('resumo'); } };

  document.querySelectorAll('[data-filtro]').forEach(b => b.onclick = () => { filtroLancamentos = b.dataset.filtro; irPara('resumo'); });
  document.getElementById('btnExportarExcel').onclick = () => baixarArquivo(M.exportarResumoCSV(estado, mesAtual), `Resumo_${mesAtual}.csv`);
};
function pct(v, total) { return total ? Math.round((v || 0) / total * 100) : 0; }
function baixarArquivo(texto, nome) {
  const blob = new Blob(['﻿' + texto], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  const pendentes = M.pendentesManuais(estado);
  layout(`
    <div style="display:flex;flex-direction:column;gap:20px;max-width:720px;margin:0 auto">
      <h1>Lançar manualmente</h1>
      <p class="sub">Para despesas que você já sabe classificar (ex.: "esse jantar foi Casa"). Quando o extrato chegar, o app confere sozinho e não conta em dobro.</p>
      <section class="card" style="display:flex;flex-direction:column;gap:16px">
        <label class="campo">Descrição
          <input type="text" id="lmDescricao" placeholder="Ex.: Jantar aniversário">
        </label>
        <div class="grade" style="grid-template-columns:1fr 1fr">
          <label class="campo">Valor (R$, só o número)
            <input type="number" min="0" step="0.01" id="lmValor" placeholder="150,00">
          </label>
          <label class="campo">Data da despesa
            <input type="date" id="lmData" value="${new Date().toISOString().slice(0, 10)}">
          </label>
        </div>
        <div role="group" aria-label="Pessoal ou Casa" style="display:flex;gap:8px">
          <button type="button" id="lmTipoPessoal" data-tipo="Pessoal" style="min-height:48px;padding:0 22px;border-radius:12px;border:2px solid #1D4ED8;background:#fff;color:#1D4ED8;font-weight:600">Pessoal</button>
          <button type="button" id="lmTipoCasa" data-tipo="Casa" style="min-height:48px;padding:0 22px;border-radius:12px;border:2px solid #B45309;background:#fff;color:#B45309;font-weight:600">Casa</button>
        </div>
        <div class="grade" style="grid-template-columns:1fr 1fr">
          <label class="campo">Categoria
            <select id="lmCategoria">${estado.categorias.map(c => `<option>${c}</option>`).join('')}</select>
          </label>
          <label class="campo oculto" id="lmFreqWrap">Frequência
            <select id="lmFrequencia">${M.FREQUENCIAS.map(f => `<option>${f}</option>`).join('')}</select>
          </label>
        </div>
        <div class="grade" style="grid-template-columns:1fr 1fr 1fr">
          <label class="campo">Banco
            <select id="lmBanco"><option>BB</option><option>XP</option><option>Sicoob</option></select>
          </label>
          <label class="campo">Conta ou cartão?
            <select id="lmOrigem"><option value="conta">Conta</option><option value="cartao">Cartão</option></select>
          </label>
          <label class="campo oculto" id="lmCompetenciaWrap">Em qual fatura (mês)?
            <input type="month" id="lmCompetencia" value="${new Date().toISOString().slice(0, 7)}">
          </label>
        </div>
        <button class="btn btn-primario btn-grande" id="lmSalvar" style="align-self:flex-start">Lançar despesa</button>
      </section>
      ${pendentes.length ? `<section class="card">
        <h2>Ainda não confirmados pelo extrato (${pendentes.length})</h2>
        <table><thead><tr><th>Data</th><th>Descrição</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>${pendentes.map(t => `<tr><td>${dataFmt(t.data)}</td><td>${t.descricao}</td><td style="text-align:right">${moeda(t.valor)}</td></tr>`).join('')}</tbody></table>
      </section>` : ''}
    </div>
  `);
  let tipoEscolhido = null;
  const btnPessoal = document.getElementById('lmTipoPessoal'), btnCasa = document.getElementById('lmTipoCasa');
  const marcarTipo = t => {
    tipoEscolhido = t;
    btnPessoal.style.background = t === 'Pessoal' ? '#1D4ED8' : '#fff'; btnPessoal.style.color = t === 'Pessoal' ? '#fff' : '#1D4ED8';
    btnCasa.style.background = t === 'Casa' ? '#B45309' : '#fff'; btnCasa.style.color = t === 'Casa' ? '#fff' : '#B45309';
    document.getElementById('lmFreqWrap').classList.toggle('oculto', t !== 'Casa');
  };
  btnPessoal.onclick = () => marcarTipo('Pessoal');
  btnCasa.onclick = () => marcarTipo('Casa');
  const origemSel = document.getElementById('lmOrigem');
  const atualizarCompetencia = () => document.getElementById('lmCompetenciaWrap').classList.toggle('oculto', origemSel.value !== 'cartao');
  origemSel.onchange = atualizarCompetencia;
  atualizarCompetencia();
  document.getElementById('lmSalvar').onclick = async () => {
    try {
      const descricao = document.getElementById('lmDescricao').value.trim();
      const valor = Number(document.getElementById('lmValor').value);
      if (!descricao) throw new Error('Informe a descrição.');
      if (!valor || valor <= 0) throw new Error('Informe o valor.');
      if (!tipoEscolhido) throw new Error('Escolha Pessoal ou Casa.');
      const origem = origemSel.value;
      const banco = document.getElementById('lmBanco').value;
      const dados = {
        data: document.getElementById('lmData').value, descricao, valor: -valor,
        tipo: tipoEscolhido, categoria: document.getElementById('lmCategoria').value,
        frequencia: tipoEscolhido === 'Casa' ? document.getElementById('lmFrequencia').value : undefined,
        banco, origem, conta: banco + (origem === 'cartao' ? ' cartão' : ' conta'),
        competencia: origem === 'cartao' ? document.getElementById('lmCompetencia').value : undefined
      };
      M.lancarManual(estado, dados);
      await salvarEstado();
      toast('Despesa lançada!');
      irPara('lancarManual');
    } catch (e) { toast(e.message, true); }
  };
};

    await salvarEstado();
    toast('Limites salvos.');

  document.getElementById('ajTrocarPasta').onclick = async () => {

  document.getElementById('btnConvite').onclick = () => {

    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
  };
};
